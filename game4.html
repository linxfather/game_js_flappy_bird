<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <script src="./tailwind4/browser.js"></script>
  <title>Flappy bird - canvas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      /* background-color: #9ae3fe; */
      background-color: #c3281b;
      color: #eee;
      font-family: "Press Start 2P", system-ui;
      font-weight: 400;
      font-style: normal;
      font-size: 16px;
    }

    .game-font-black {
      font-size: 18px;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        -2px 0 0 #000,
        2px 0 0 #000,
        0 -2px 0 #000,
        0 2px 0 #000;
    }
  </style>
</head>

<body class="game-font-black">
  <div class="flex flex-col h-screen">
    <div class="flex justify-center md:m-2" style="background-color: #c3281b;">
      <div class="">Flappy bird</div>
    </div>
    <div class="flex justify-center items-center grow" style="background-color: #9ae3fe;">
      <div class="md:border-4 md:border-red-500">
         <canvas id="main_game" class="cursor-pointer" width="375" height="568"></canvas>
      </div>
    </div>
    <script type="module">
      import { game } from './lib/game3.js';
      document.addEventListener('DOMContentLoaded', game.bind(null, 'main_game')); 
    </script>
</body>

</html>
