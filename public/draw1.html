<!DOCTYPE html>
<html>
  <head>
    <title>draw1</title>
    <style>
      body {
        background-color: black;
        color: white;
      }
      canvas {
        border: 4px solid white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h3>draw1</h3>
    <h4>TEST - loadImgAsync, canvasGame function</h4>
    <div style="display: flex; justify-content: center;">
      <canvas id="main_game" width="375" height="240"></canvas>
    </div>
    <script type="module">
      function loadImgAsync(src) {
        return new Promise((result, reject) => {
          const img = new Image();
          img.onload = () => {
            result(img);
          };
          img.onerror = reject;
          img.src=src;
        });
      }
      async function canvasGame() {
        const canvas = document.getElementById('main_game');
         /** @type {CanvasRenderingContext2D} */
        const ctx = canvas.getContext('2d');
        // init color
        ctx.fillStyle = 'red';
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2;
        ctx.font = '20px Arial';
        const img = await loadImgAsync('/img/screens/tube1-1.png');
        // text
        ctx.fillText('canvas text', 10, 20);
        // rect
        ctx.fillRect(10, 40, 80, 20);
        // image
        ctx.drawImage(img, 50, 20);
      };
      document.addEventListener('DOMContentLoaded', canvasGame);
    </script>
  </body>
</html>
